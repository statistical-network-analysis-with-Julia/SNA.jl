<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Filters for Depth/Shadow -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients for Julia Colors -->
    <!-- Purple -->
    <radialGradient id="grad-purple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#b57fe3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9558B2;stop-opacity:1" />
    </radialGradient>

    <!-- Red -->
    <radialGradient id="grad-red" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#e65c53;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CB3C33;stop-opacity:1" />
    </radialGradient>

    <!-- Green -->
    <radialGradient id="grad-green" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#5cb84b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#389826;stop-opacity:1" />
    </radialGradient>

    <!-- Blue -->
    <radialGradient id="grad-blue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#6b8bdb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4063D8;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background Container -->
  <rect x="5" y="5" width="190" height="190" rx="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Network Graph -->
  <g transform="translate(0, -12)">
    <!-- Edges (Blue lines) -->
    <!-- Top to Left -->
    <line x1="100" y1="45" x2="48" y2="90" stroke="#4063D8" stroke-width="3" stroke-linecap="round"/>
    <!-- Top to Right -->
    <line x1="100" y1="45" x2="152" y2="90" stroke="#4063D8" stroke-width="3" stroke-linecap="round"/>
    <!-- Left to Bottom-Left -->
    <line x1="48" y1="90" x2="65" y2="145" stroke="#4063D8" stroke-width="3" stroke-linecap="round"/>
    <!-- Left to Right -->
    <line x1="48" y1="90" x2="152" y2="90" stroke="#4063D8" stroke-width="3" stroke-linecap="round"/>
    <!-- Right to Bottom-Right -->
    <line x1="152" y1="90" x2="135" y2="145" stroke="#4063D8" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom-Left to Bottom-Right -->
    <line x1="65" y1="145" x2="135" y2="145" stroke="#4063D8" stroke-width="3" stroke-linecap="round"/>

    <!-- Nodes -->
    <!-- Top: Purple -->
    <circle cx="100" cy="45" r="16" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Left: Red -->
    <circle cx="48" cy="90" r="16" fill="url(#grad-red)" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Right: Green -->
    <circle cx="152" cy="90" r="16" fill="url(#grad-green)" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Bottom-Left: Blue -->
    <circle cx="65" cy="145" r="16" fill="url(#grad-blue)" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)"/>
    <!-- Bottom-Right: Purple -->
    <circle cx="135" cy="145" r="16" fill="url(#grad-purple)" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)"/>
  </g>

  <!-- Text "SNA.jl" -->
  <g transform="translate(100, 185)" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="30" letter-spacing="1">
    <!-- S: Purple -->
    <text x="-42" y="0" fill="#9558B2" filter="url(#dropShadow)">S</text>
    <!-- N: Red -->
    <text x="-20" y="0" fill="#CB3C33" filter="url(#dropShadow)">N</text>
    <!-- A: Green -->
    <text x="4" y="0" fill="#389826" filter="url(#dropShadow)">A</text>
    <!-- .: Dark Grey -->
    <text x="22" y="0" fill="#555555">.</text>
    <!-- j: Purple -->
    <text x="32" y="0" fill="#9558B2" filter="url(#dropShadow)">j</text>
    <!-- l: Red -->
    <text x="45" y="0" fill="#CB3C33" filter="url(#dropShadow)">l</text>
  </g>

</svg>
